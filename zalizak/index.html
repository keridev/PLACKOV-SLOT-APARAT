<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZALIZAK APARATURA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a0a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            width: 100%;
            padding: 20px;
        }

        .title {
            text-align: center;
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #ff00ff, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 0, 255, 0.5);
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .balance-display {
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.2), rgba(0, 255, 255, 0.2));
            border: 2px solid #00ffff;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .balance-display h2 {
            font-size: 1.2em;
            color: #00ffff;
            margin: 0;
        }

        .balance-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .hair-follicle {
            width: 50px;
            height: 50px;
            animation: folliclePulse 2s ease-in-out infinite;
        }

        .hair-follicle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
        }

        @keyframes folliclePulse {
            0%, 100% { 
                transform: scale(1); 
            }
            50% { 
                transform: scale(1.05); 
            }
        }

        .balance {
            font-size: 2.5em;
            font-weight: bold;
            color: #ffff00;
            text-shadow: 0 0 20px rgba(255, 255, 0, 0.5);
        }

        .slot-machine {
            background: linear-gradient(135deg, rgba(30, 0, 50, 0.9), rgba(10, 0, 30, 0.9));
            border: 3px solid #ff00ff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 50px rgba(255, 0, 255, 0.4), inset 0 0 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .reels-container {
            position: relative;
            margin-bottom: 30px;
        }

        .reels {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            position: relative;
            z-index: 2;
        }

        .reel {
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.8), rgba(20, 0, 40, 0.8));
            border: 2px solid #00ffff;
            border-radius: 10px;
            overflow: hidden;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 255, 255, 0.3);
            position: relative;
        }

        .symbol {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            padding: 5px;
        }

        .symbol img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
        }

        .symbol.kameri {
            animation: jackpotGlow 1s ease-in-out infinite;
        }

        .symbol.kameri img {
            filter: drop-shadow(0 0 10px #FF1493);
        }

        @keyframes jackpotGlow {
            0%, 100% { 
                transform: scale(1); 
            }
            50% { 
                transform: scale(1.1); 
            }
        }

        .spinning .symbol {
            animation: spin 0.1s linear infinite;
        }

        @keyframes spin {
            0% { transform: translateY(-100%); opacity: 0.5; }
            100% { transform: translateY(100%); opacity: 0.5; }
        }

        .paylines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .payline {
            position: absolute;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .payline.active {
            opacity: 1;
            animation: line-glow 0.5s ease-in-out infinite;
        }

        @keyframes line-glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.5); }
        }

        .line-horizontal {
            height: 4px;
            background: linear-gradient(90deg, transparent, #00ff00, transparent);
            left: 0;
            right: 0;
            box-shadow: 0 0 10px #00ff00;
        }

        .line-diagonal {
            height: 4px;
            background: linear-gradient(90deg, transparent, #00ff00, transparent);
            transform-origin: left center;
            box-shadow: 0 0 10px #00ff00;
        }

        .line-0 { top: 60px; }
        .line-1 { top: 50%; transform: translateY(-50%); }
        .line-2 { bottom: 60px; }
        .line-3 { 
            top: 60px; 
            width: 141.42%; 
            transform: rotate(26.565deg);
            left: -20%;
        }
        .line-4 { 
            bottom: 60px; 
            width: 141.42%; 
            transform: rotate(-26.565deg);
            left: -20%;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .bet-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #ff00ff;
        }

        .bet-label {
            font-size: 1.2em;
            color: #00ffff;
        }

        .bet-btn {
            width: 50px;
            height: 50px;
            font-size: 1.5em;
            font-weight: bold;
            background: linear-gradient(135deg, #ff00ff, #ff00aa);
            border: 2px solid #00ffff;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.5);
        }

        .bet-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.8);
        }

        .bet-btn:active {
            transform: scale(0.95);
        }

        .bet-amount {
            font-size: 2em;
            font-weight: bold;
            color: #ffff00;
            min-width: 100px;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 255, 0, 0.5);
        }

        .spin-btn {
            width: 100%;
            padding: 25px;
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(135deg, #00ff00, #00cc00);
            border: 3px solid #ffff00;
            border-radius: 15px;
            color: white;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .spin-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.8);
        }

        .spin-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .spin-btn:disabled {
            background: linear-gradient(135deg, #666, #444);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .message {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.3em;
            font-weight: bold;
            margin-top: 20px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message.win {
            background: linear-gradient(135deg, rgba(0, 255, 0, 0.3), rgba(0, 200, 0, 0.3));
            border: 2px solid #00ff00;
            color: #00ff00;
            animation: pulse 0.5s ease-in-out infinite;
        }

        .message.jackpot {
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.4), rgba(255, 215, 0, 0.4));
            border: 2px solid #ffd700;
            color: #ffd700;
            animation: jackpot-pulse 0.3s ease-in-out infinite;
            font-size: 2em;
        }

        .message.limit {
            background: rgba(255, 165, 0, 0.3);
            border: 2px solid #ff8800;
            color: #ffaa00;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes jackpot-pulse {
            0%, 100% { transform: scale(1) rotate(-1deg); }
            50% { transform: scale(1.1) rotate(1deg); }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2em;
            }

            .reel {
                height: 80px;
            }

            .symbol {
                width: 60px;
                height: 60px;
            }

            .bet-controls {
                flex-wrap: wrap;
            }

            .spin-btn {
                font-size: 1.5em;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">ZALIZAK APARATURA</h1>
        
        <div class="balance-display">
            <h2>VLAKNA</h2>
            <div class="balance-content">
                <div class="hair-follicle">
                    <img src="images/vlakno.png" alt="Vlakno">
                </div>
                <div class="balance" id="balance">100</div>
            </div>
        </div>

        <div class="slot-machine">
            <div class="reels-container">
                <div class="paylines">
                    <div class="payline line-horizontal line-0"></div>
                    <div class="payline line-horizontal line-1"></div>
                    <div class="payline line-horizontal line-2"></div>
                    <div class="payline line-diagonal line-3"></div>
                    <div class="payline line-diagonal line-4"></div>
                </div>
                
                <div class="reels" id="reels">
                    <div class="reel"><div class="symbol"><img src="images/kafe.jpg" alt="symbol"></div></div>
                    <div class="reel"><div class="symbol"><img src="images/zalizak.jpg" alt="symbol"></div></div>
                    <div class="reel"><div class="symbol"><img src="images/menche.jpg" alt="symbol"></div></div>
                    <div class="reel"><div class="symbol"><img src="images/rs6.jpg" alt="symbol"></div></div>
                    <div class="reel"><div class="symbol"><img src="images/honda.jgp" alt="symbol"></div></div>
                    <div class="reel"><div class="symbol"><img src="images/kameri.png" alt="symbol"></div></div>
                    <div class="reel"><div class="symbol"><img src="images/kafe.jpg" alt="symbol"></div></div>
                    <div class="reel"><div class="symbol"><img src="images/zalizak.jpg" alt="symbol"></div></div>
                    <div class="reel"><div class="symbol"><img src="images/menche.jpg" alt="symbol"></div></div>
                </div>
            </div>

            <div class="controls">
                <div class="bet-controls">
                    <span class="bet-label">BET:</span>
                    <button class="bet-btn" id="decreaseBet">-</button>
                    <div class="bet-amount" id="betAmount">1</div>
                    <button class="bet-btn" id="increaseBet">+</button>
                </div>

                <button class="spin-btn" id="spinBtn">SPIN</button>
            </div>

            <div class="message" id="message"></div>
        </div>
    </div>

    <script>
        const symbols = ['kafe', 'zalizak', 'menche', 'rs6', 'honda', 'kameri'];
        const symbolIcons = {
            kafe: '<img src="images/kafe.jpg" alt="kafe">',
            zalizak: '<img src="images/zalizak.jpg" alt="zalizak">',
            menche: '<img src="images/menche.jpg" alt="menche">',
            rs6: '<img src="images/rs6.jpg" alt="rs6">',
            honda: '<img src="images/honda.jpg" alt="honda">',
            kameri: '<img src="images/kameri.png" alt="kameri">'
        };
        const payouts = {
            honda: 1,
            zalizak: 2,
            menche: 5,
            kafe: 10,
            rs6: 25,
            kameri: 100
        };

        let balance = 100;
        let bet = 1;
        let isSpinning = false;

        const reels = document.querySelectorAll('.reel');
        const balanceEl = document.getElementById('balance');
        const betAmountEl = document.getElementById('betAmount');
        const spinBtn = document.getElementById('spinBtn');
        const messageEl = document.getElementById('message');
        const decreaseBetBtn = document.getElementById('decreaseBet');
        const increaseBetBtn = document.getElementById('increaseBet');

        function getRandomSymbol() {
            return symbols[Math.floor(Math.random() * symbols.length)];
        }

        function updateDisplay() {
            balanceEl.textContent = balance;
            betAmountEl.textContent = bet;
        }

        function showMessage(text, type = '') {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
            if (text === '') {
                messageEl.style.minHeight = '50px';
            }
        }

        decreaseBetBtn.addEventListener('click', () => {
            if (bet > 1 && !isSpinning) {
                bet--;
                updateDisplay();
                showMessage('');
            } else if (bet === 1) {
                showMessage('MINIMUM BET LIMIT', 'limit');
                setTimeout(() => showMessage(''), 2000);
            }
        });

        increaseBetBtn.addEventListener('click', () => {
            if (bet < 100 && bet < balance && !isSpinning) {
                bet++;
                updateDisplay();
                showMessage('');
            } else if (bet >= 100) {
                showMessage('MAX BET LIMIT', 'limit');
                setTimeout(() => showMessage(''), 2000);
            } else if (bet >= balance) {
                showMessage('INSUFFICIENT BALANCE', 'limit');
                setTimeout(() => showMessage(''), 2000);
            }
        });

        spinBtn.addEventListener('click','space_bar_press' () => {
            if (isSpinning || balance < bet) {
                if (balance < bet) {
                    showMessage('INSUFFICIENT BALANCE', 'limit');
                    setTimeout(() => showMessage(''), 2000);
                }
                return;
            }

            spin();
        });

        async function spin() {
            isSpinning = true;
            spinBtn.disabled = true;
            balance -= bet;
            updateDisplay();
            showMessage('');

            document.querySelectorAll('.payline').forEach(line => line.classList.remove('active'));

            reels.forEach(reel => reel.classList.add('spinning'));

            const results = [];
            for (let i = 0; i < 9; i++) {
                results.push(getRandomSymbol());
            }

            await new Promise(resolve => setTimeout(resolve, 2000));

            reels.forEach((reel, i) => {
                reel.classList.remove('spinning');
                const symbol = reel.querySelector('.symbol');
                symbol.className = 'symbol ' + results[i];
                symbol.innerHTML = symbolIcons[results[i]];
            });

            await new Promise(resolve => setTimeout(resolve, 300));

            checkWin(results);

            isSpinning = false;
            spinBtn.disabled = false;
        }

        function checkWin(results) {
            const paylines = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 4, 8],
                [2, 4, 6]
            ];

            let totalWin = 0;
            let winningLines = [];
            let jackpotWon = false;

            paylines.forEach((line, index) => {
                const [a, b, c] = line;
                const symbol = results[a];

                if (results[a] === results[b] && results[b] === results[c]) {
                    if (symbol === 'kameri') {
                        if (!jackpotWon) {
                            totalWin += payouts[symbol] * bet;
                            winningLines.push(index);
                            jackpotWon = true;
                        }
                    } else {
                        totalWin += payouts[symbol] * bet;
                        winningLines.push(index);
                    }
                }
            });

            if (totalWin > 0) {
                balance += totalWin;
                updateDisplay();

                winningLines.forEach(lineIndex => {
                    document.querySelectorAll('.payline')[lineIndex].classList.add('active');
                });

                if (jackpotWon) {
                    showMessage(`🎉 JACKPOT! WON ${totalWin} VLAKNA! 🎉`, 'jackpot');
                } else {
                    showMessage(`YOU WIN ${totalWin} VLAKNA!`, 'win');
                }
            } else {
                showMessage('TRY AGAIN');
                setTimeout(() => showMessage(''), 2000);
            }
        }

        updateDisplay();
    </script>
</body>
</html>
